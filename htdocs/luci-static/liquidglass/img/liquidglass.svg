<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="glassBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1d4ed8" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#glassBg)" filter="url(#glow)"/>
  <rect x="5" y="5" width="54" height="27" rx="15" fill="url(#shine)"/>
  <rect x="4.5" y="4.5" width="55" height="55" rx="15.5" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>
  <!-- Router Antennas -->
  <path d="M21 21v-7M43 21v-7" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round"/>
  <!-- Router Body -->
  <rect x="15" y="21" width="34" height="22" rx="7" fill="#ffffff" fill-opacity="0.22" stroke="#ffffff" stroke-width="2.2"/>
  <!-- Signal LEDs -->
  <circle cx="24" cy="32" r="2.4" fill="#ffffff"/>
  <circle cx="32" cy="32" r="2.4" fill="#ffffff"/>
  <circle cx="40" cy="32" r="2.4" fill="#34d399"/>
</svg>
